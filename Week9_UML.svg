<text x="515" y="280" font-size="14" font-weight="normal">0..*</text>
<text x="40" y="1010" font-size="17" font-weight="normal">Solid hollow triangle: inheritance | Dashed hollow triangle: interface realisation | Hollow diamond: aggregation</text>
<text x="40" y="1042" font-size="17" font-weight="normal">+ public    - private    # internal helper by convention | Both subclasses reuse constructor and display via super().</text>
<text x="40" y="1074" font-size="17" font-weight="normal">Inventory stores Product objects; menu and JSON handling are separate functions. DigitalProduct has no shipping interface.</text>
