<path d="M925 800 V492" fill="none" stroke="#334b70" stroke-width="2" marker-end="url(#tri)"/>
<path d="M40 900 H20 V620 H250 V588" fill="none" stroke="#334b70" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#tri)"/>
<path d="M490 260 H650" fill="none" stroke="#334b70" stroke-width="2" />
<text x="500" y="245" font-size="17" font-weight="normal">1</text>
<text x="605" y="245" font-size="17" font-weight="normal">0..*</text>
<text x="520" y="290" font-size="17" font-weight="normal">supplies</text>
<path d="M1500 300 L1486 292 L1472 300 L1486 308 Z M1472 300 H1300" fill="none" stroke="#334b70" stroke-width="2" />
<text x="1310" y="280" font-size="17" font-weight="normal">0..*</text>
<text x="1435" y="280" font-size="17" font-weight="normal">0..*</text>
<text x="1360" y="330" font-size="17" font-weight="normal">stores</text>
<path d="M1700 958 l-8 14 l8 14 l8 -14 Z" fill="#334b70" stroke="#334b70"/>
<path d="M1700 986 V1120" fill="none" stroke="#334b70" stroke-width="2" />
<text x="1720" y="978" font-size="17" font-weight="normal">1</text>
<text x="1720" y="1100" font-size="17" font-weight="normal">0..*</text>
<text x="1720" y="1050" font-size="17" font-weight="normal">owns</text>
<path d="M1950 1250 H1980 V560 H1300 V400" fill="none" stroke="#334b70" stroke-width="2" />
<text x="1900" y="1230" font-size="17" font-weight="normal">0..*</text>
<text x="1310" y="440" font-size="17" font-weight="normal">1</text>
<text x="1580" y="545" font-size="17" font-weight="normal">refers to existing Product</text>
<text x="40" y="1450" font-size="22" font-weight="normal">Solid hollow triangle: inheritance   Dashed hollow triangle: interface realisation</text>
<text x="40" y="1490" font-size="22" font-weight="normal">Plain line: association   Hollow diamond: aggregation   Filled diamond: composition</text>
<text x="40" y="1530" font-size="22" font-weight="normal">Diamonds are at the whole end. Each Product has one Supplier; each OrderLine belongs to one Order.</text>
<text x="40" y="1570" font-size="22" font-weight="normal">Menu and JSON storage are functions, not extra classes. Type hints describe the design; they do not enforce it.</text>
</g></svg>