<text x="40" y="1450" font-size="22" font-weight="normal">Solid hollow triangle: inheritance   Dashed hollow triangle: interface realisation</text>
<text x="40" y="1490" font-size="22" font-weight="normal">Plain line: association   Hollow diamond: aggregation   Filled diamond: composition</text>
<text x="40" y="1530" font-size="22" font-weight="normal">Diamonds are at the whole end. Each Product has one Supplier; each OrderLine belongs to one Order.</text>
<text x="40" y="1570" font-size="22" font-weight="normal">Menu and JSON storage are functions, not extra classes. Type hints describe the design; they do not enforce it.</text>
