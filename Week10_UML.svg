<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1600" viewBox="0 0 2000 1600">
<defs><marker id="tri" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1 L12 7 L1 13 Z" fill="white" stroke="#334b70" stroke-width="1.5"/></marker></defs>
<rect width="2000" height="1600" fill="#f5f7fb"/>
<g font-family="Arial,sans-serif" fill="#17243a">
<text x="40" y="55" font-size="36" font-weight="bold">Week 10 object relationships</text>
<text x="40" y="95" font-size="21" font-weight="normal">Typed class overview   Full signatures and constructors are listed in Week10_UML.md</text>
<rect x="40" y="150" width="450" height="206" rx="5" fill="white" stroke="#334b70" stroke-width="2"/>
<text x="58" y="185" font-size="24" font-weight="bold">Supplier</text>
<path d="M40 202 H490" stroke="#334b70"/>
<text x="58" y="232" font-size="20" font-weight="normal">- supplier_id: String</text>
<text x="58" y="266" font-size="20" font-weight="normal">- name: String</text>
<text x="58" y="300" font-size="20" font-weight="normal">- contact_email: String</text>
<text x="58" y="334" font-size="20" font-weight="normal">+ display_information(): void</text>
<rect x="650" y="150" width="650" height="342" rx="5" fill="white" stroke="#334b70" stroke-width="2"/>
<text x="668" y="185" font-size="24" font-weight="bold">Product &lt;&lt;abstract&gt;&gt;</text>
<path d="M650 202 H1300" stroke="#334b70"/>
<text x="668" y="232" font-size="20" font-weight="normal">- product_id: String; name: String</text>
<text x="668" y="266" font-size="20" font-weight="normal">- price: Real; stock: Integer</text>
<text x="668" y="300" font-size="20" font-weight="normal">- transaction_history: Integer [0..*]</text>
<text x="668" y="334" font-size="20" font-weight="normal">- supplier: Supplier</text>
<text x="668" y="368" font-size="20" font-weight="normal">+ read-only properties for stored data</text>
<text x="668" y="402" font-size="20" font-weight="normal">+ update_stock(quantity: Integer): void</text>
<text x="668" y="436" font-size="20" font-weight="normal">+ display_information(): void</text>
<text x="668" y="470" font-size="20" font-weight="normal">+ get_fulfilment_info(): String {abstract}</text>
<rect x="1500" y="150" width="450" height="274" rx="5" fill="white" stroke="#334b70" stroke-width="2"/>
<text x="1518" y="185" font-size="24" font-weight="bold">Inventory</text>
<path d="M1500 202 H1950" stroke="#334b70"/>
<text x="1518" y="232" font-size="20" font-weight="normal">- products: Product [0..*]</text>
<text x="1518" y="266" font-size="20" font-weight="normal">+ add_product(Product): void</text>
<text x="1518" y="300" font-size="20" font-weight="normal">+ find_product(String): Product or None</text>
<text x="1518" y="334" font-size="20" font-weight="normal">+ remove_product(String): Product or None</text>
<text x="1518" y="368" font-size="20" font-weight="normal">+ get_products(): Product [0..*]</text>
<text x="1518" y="402" font-size="20" font-weight="normal">+ display_all(): void</text>
<rect x="40" y="450" width="450" height="138" rx="5" fill="white" stroke="#334b70" stroke-width="2"/>
<text x="58" y="485" font-size="24" font-weight="bold">CanBeShipped &lt;&lt;interface&gt;&gt;</text>
<path d="M40 502 H490" stroke="#334b70"/>
<text x="58" y="532" font-size="20" font-weight="normal">+ calculate_shipping_cost(): Real</text>
<text x="58" y="566" font-size="20" font-weight="normal">  {abstract}</text>
<rect x="40" y="800" width="550" height="240" rx="5" fill="white" stroke="#334b70" stroke-width="2"/>
<text x="58" y="835" font-size="24" font-weight="bold">PhysicalProduct</text>
<path d="M40 852 H590" stroke="#334b70"/>
<text x="58" y="882" font-size="20" font-weight="normal">- weight: Real</text>
<text x="58" y="916" font-size="20" font-weight="normal">+ weight: Real {read-only}</text>
<text x="58" y="950" font-size="20" font-weight="normal">+ display_information(): void</text>
<text x="58" y="984" font-size="20" font-weight="normal">+ get_fulfilment_info(): String</text>
<text x="58" y="1018" font-size="20" font-weight="normal">+ calculate_shipping_cost(): Real</text>
<rect x="650" y="800" width="550" height="206" rx="5" fill="white" stroke="#334b70" stroke-width="2"/>
<text x="668" y="835" font-size="24" font-weight="bold">DigitalProduct</text>
<path d="M650 852 H1200" stroke="#334b70"/>
<text x="668" y="882" font-size="20" font-weight="normal">- download_size: Real</text>
<text x="668" y="916" font-size="20" font-weight="normal">+ download_size: Real {read-only}</text>
<text x="668" y="950" font-size="20" font-weight="normal">+ display_information(): void</text>
<text x="668" y="984" font-size="20" font-weight="normal">+ get_fulfilment_info(): String</text>
<rect x="1450" y="650" width="500" height="308" rx="5" fill="white" stroke="#334b70" stroke-width="2"/>
<text x="1468" y="685" font-size="24" font-weight="bold">Order</text>
<path d="M1450 702 H1950" stroke="#334b70"/>
<text x="1468" y="732" font-size="20" font-weight="normal">- order_id: String</text>
<text x="1468" y="766" font-size="20" font-weight="normal">- order_lines: OrderLine [0..*]</text>
<text x="1468" y="800" font-size="20" font-weight="normal">+ add_order_line(Product, Integer): void</text>
<text x="1468" y="834" font-size="20" font-weight="normal">+ remove_order_line(Integer): void</text>
<text x="1468" y="868" font-size="20" font-weight="normal">+ get_order_lines(): OrderLine [0..*]</text>
<text x="1468" y="902" font-size="20" font-weight="normal">+ calculate_total(): Real</text>
<text x="1468" y="936" font-size="20" font-weight="normal">+ display_information(): void</text>
<rect x="1450" y="1120" width="500" height="274" rx="5" fill="white" stroke="#334b70" stroke-width="2"/>
<text x="1468" y="1155" font-size="24" font-weight="bold">OrderLine</text>
<path d="M1450 1172 H1950" stroke="#334b70"/>
<text x="1468" y="1202" font-size="20" font-weight="normal">- product: Product</text>
<text x="1468" y="1236" font-size="20" font-weight="normal">- quantity: Integer</text>
<text x="1468" y="1270" font-size="20" font-weight="normal">+ product: Product {read-only}</text>
<text x="1468" y="1304" font-size="20" font-weight="normal">+ quantity: Integer {read-only}</text>
<text x="1468" y="1338" font-size="20" font-weight="normal">+ calculate_subtotal(): Real</text>
<text x="1468" y="1372" font-size="20" font-weight="normal">+ display_information(): void</text>
